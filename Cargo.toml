[package]
name = "tenis-ahora-api"
version = "1.0.0"
edition = "2021"
description = "API de prueba (Rust + axum + SQLite) para el frontend Tenis Ahora"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rusqlite sin `bundled`: se enlaza contra lib/sqlite3.dll (ver .cargo/config.toml y build.rs),
# así no hace falta un compilador C en la máquina.
rusqlite = "0.32"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
bcrypt = "0.16"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
